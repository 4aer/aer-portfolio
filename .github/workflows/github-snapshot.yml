name: Refresh GitHub activity snapshot

on:
  schedule:
    # Runs daily at 03:00 UTC — adjust as you like.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch snapshot
        env:
          GH_SNAPSHOT_TOKEN: ${{ secrets.GH_SNAPSHOT_TOKEN }}
          GITHUB_USERNAME: 4aer
        run: node scripts/fetch-github-snapshot.js

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/github-activity.json
          git diff --staged --quiet || git commit -m "chore: refresh github activity snapshot"
          git push
